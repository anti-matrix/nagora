<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NAGORA</title>
    <link rel="icon" type="image/png" href="imgs/favico.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link href="css/TpAnCYVgvO2tJpD.css" rel="stylesheet"/>
    <script type="text/javascript" src="scripts/KVGDTejidg0j6k6.js"></script>
</head>
<body class="app-body">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">USUÁRIOS</div>
            <div class="user-list" id="user-list"></div>
        </aside>
        <main class="main">
            <div class="dm-placeholder" id="dm-placeholder">Selecione um usuário para conversar</div>
            <div class="dm-panel" id="dm-panel" hidden>
                <div class="dm-header">
                    <span class="status-dot offline" id="dm-status" aria-hidden="true"></span>
                    <h4 id="dm-username"></h4>
                </div>
                <div class="dm-typing" id="dm-typing"></div>
                <div class="dm-messages" id="dm-messages"></div>
                <div class="dm-composer">
                    <div class="dm-attach-wrap">
                        <button type="button" class="dm-attach-btn" id="dm-attach" aria-label="Anexo"><i class="bi bi-paperclip"></i></button>
                        <div class="dm-attach-menu hidden-field" id="dm-attach-menu">
                            <button type="button" disabled title="em breve"><i class="bi bi-image"></i> Imagem</button>
                            <button type="button" disabled title="em breve"><i class="bi bi-camera-video"></i> Vídeo</button>
                        </div>
                    </div>
                    <textarea class="dm-input" id="dm-input" rows="1" placeholder="Digite uma mensagem" aria-label="Mensagem"></textarea>
                    <button type="button" class="dm-audio-btn" id="dm-audio" disabled title="Áudio em breve" aria-label="Áudio"><i class="bi bi-mic"></i></button>
                    <button type="button" class="dm-send-btn" id="dm-send" aria-label="Enviar"><i class="bi bi-send"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/UGqaIF1Z55PgcI4.js"></script>
</body>
</html>
