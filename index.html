<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NAGORA — Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link href="css/nagora.css" rel="stylesheet"/>
    <script type="text/javascript" src="scripts/userId.js"></script>
</head>
<body>
    <h1 class="nagora-title">NAGORA</h1>

    <div class="auth-card">
        <div class="auth-nav">
            <button id="tab-login" class="active" type="button">Entrar</button>
            <button id="tab-signup" type="button">Criar conta</button>
        </div>

        <div class="auth-body">
            <h4 class="text-center mb-4">Acesse sua conta</h4>

            <div id="message" class="mb-3 small"></div>

            <form id="auth-form" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" autocomplete="username" required/>
                    <div class="form-text">5 a 15 caracteres, sem espaços</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required/>
                    <div class="form-text" id="password-help">Mínimo 8 caracteres, com letras e números</div>
                </div>

                <div class="mb-3 hidden-field" id="confirm-group">
                    <label for="confirm-password" class="form-label">Confirmar senha</label>
                    <input type="password" class="form-control" id="confirm-password" autocomplete="new-password"/>
                </div>

                <button type="submit" class="btn btn-light w-100" id="submit-btn">Entrar</button>
            </form>

            <div id="apikey-section" class="mt-4 hidden-field">
                <button type="button" class="btn btn-outline-light w-100" id="get-key-btn">Obtenha sua chave</button>
                <div id="apikey-reveal" class="mt-3 hidden-field">
                    <div class="input-group">
                        <input type="text" class="form-control" id="apikey" readonly/>
                        <button type="button" class="btn btn-secondary" id="copy-key-btn">Copiar</button>
                    </div>
                    <a href="app.html" class="btn btn-success w-100 mt-3" id="enter-app-btn">Entrar no NAGORA</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/nagora.js"></script>
</body>
</html>
